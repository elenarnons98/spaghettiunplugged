<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spaghetti Unplugged 2027</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- HOME: NAVBAR + VIDEO HERO -->
  <section id="home" class="hero">
    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
      aria-hidden="true"
    >
      <source src="img/tappo generico.mp4" type="video/mp4">
    </video>

    <!-- Navbar sovrapposta al video -->
    <nav class="hero-navbar" aria-label="Navigazione principale">
      <a class="mobile-brand" href="#home">SPAGHETTI UNPLUGGED</a>
      <a class="desktop-nav-link" href="#home">Home</a>
      <a class="desktop-nav-link" href="#eventi">Eventi</a>
      <a class="desktop-nav-link" href="#chi-siamo">Chi siamo</a>
      <a class="desktop-nav-link" href="#info">Info</a>
      <button
        class="mobile-menu-toggle"
        type="button"
        aria-label="Apri il menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
      >
        <span></span>
        <span></span>
      </button>
    </nav>
  </section>
  <!-- FINE HOME -->

  <div class="mobile-menu-panel" id="mobile-menu" role="dialog" aria-modal="true" aria-label="Menu mobile" hidden>
    <div class="mobile-menu-header">
      <a class="mobile-menu-brand" href="#home">SPAGHETTI UNPLUGGED</a>
      <button class="mobile-menu-close" type="button" aria-label="Chiudi il menu">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <nav class="mobile-menu-links" aria-label="Navigazione mobile">
      <a href="#eventi">Eventi</a>
      <a href="#chi-siamo">Chi siamo</a>
      <a href="#info">Info utili</a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script>
    (() => {
      const menu = document.querySelector('#mobile-menu');
      const openButton = document.querySelector('.mobile-menu-toggle');
      const closeButton = document.querySelector('.mobile-menu-close');
      const menuLinks = menu.querySelectorAll('a');
      const focusableElements = [closeButton, ...menuLinks];

      function openMenu() {
        menu.hidden = false;
        openButton.setAttribute('aria-expanded', 'true');
        openButton.setAttribute('aria-label', 'Menu aperto');
        document.body.classList.add('mobile-menu-open');
        closeButton.focus();
      }

      function closeMenu(restoreFocus = true) {
        menu.hidden = true;
        openButton.setAttribute('aria-expanded', 'false');
        openButton.setAttribute('aria-label', 'Apri il menu');
        document.body.classList.remove('mobile-menu-open');
        if (restoreFocus) openButton.focus();
      }

      openButton.addEventListener('click', openMenu);
      closeButton.addEventListener('click', () => closeMenu());

      menuLinks.forEach((link) => {
        link.addEventListener('click', () => closeMenu(false));
      });

      document.addEventListener('keydown', (event) => {
        if (menu.hidden) return;

        if (event.key === 'Escape') {
          closeMenu();
          return;
        }

        if (event.key === 'Tab') {
          const firstElement = focusableElements[0];
          const lastElement = focusableElements[focusableElements.length - 1];

          if (event.shiftKey && document.activeElement === firstElement) {
            event.preventDefault();
            lastElement.focus();
          } else if (!event.shiftKey && document.activeElement === lastElement) {
            event.preventDefault();
            firstElement.focus();
          }
        }
      });
    })();
  </script>
</body>
</html>
